<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9A4A1F">
<title>甜品糖水铺 · 自助点餐</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 24h48l-4 22a8 8 0 0 1-8 8H20a8 8 0 0 1-8-8z' fill='%239A4A1F'/%3E%3Cpath d='M20 24c0-8 5-14 12-14s12 6 12 14' fill='none' stroke='%23E8A33D' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M16 12h6M32 6v8M48 12h-6' stroke='%23E8A33D' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ============================================================
   甜品糖水自助点餐系统 · 内联样式
   配色：红糖棕 / 冰糖金 / 米纸底
   ============================================================ */
:root{
  --bg:#FBF3E6;
  --surface:#FFFFFF;
  --ink:#3A2A1C;
  --ink-2:#6E5A48;
  --ink-3:#9C8872;
  --brand:#9A4A1F;
  --brand-d:#7C3715;
  --brand-l:#F6E3D0;
  --amber:#E8A33D;
  --amber-l:#FBEED8;
  --line:#EDDFCB;
  --ok:#2F7D4D;
  --ok-l:#E4F2E8;
  --danger:#C2452B;
  --danger-l:#FBE9E4;
  --r:16px;
  --shadow:0 10px 30px rgba(58,42,26,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:auto}
body{
  margin:0;padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  font-size:15px;line-height:1.55;
}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
img{display:block}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:120px;position:relative}
.hidden{display:none!important}
.muted{color:var(--ink-3)}

/* ---------- 通用按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:700;
  transition:transform .06s ease,opacity .15s ease;
  user-select:none;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(154,74,31,.28);width:100%}
.btn-ghost{background:var(--brand-l);color:var(--brand-d)}
.btn-line{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--danger-l);color:var(--danger)}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn-block{width:100%}

/* ---------- 顶部 ---------- */
.header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--brand) 0%,#8E431C 100%);
  color:#fff;padding:14px 16px calc(14px + env(safe-area-inset-top));
}
.header-row{display:flex;align-items:center;gap:12px}
.logo-mark{
  width:44px;height:44px;border-radius:14px;flex:none;
  background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;
}
.logo-mark svg{width:28px;height:28px}
.shop-name{font-size:19px;font-weight:800;letter-spacing:.5px;line-height:1.25}
.shop-slogan{font-size:14px;color:rgba(255,255,255,.82);margin-top:2px}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn{
  width:44px;height:44px;border-radius:12px;border:none;
  background:rgba(255,255,255,.16);color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn svg{width:22px;height:22px}

/* 公告条 */
.notice-bar{
  margin:12px 12px 0;background:var(--amber-l);color:#7A5210;
  border:1px solid #F2D9A8;border-radius:12px;
  padding:9px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start;
}
.notice-bar svg{width:16px;height:16px;flex:none;margin-top:2px}

/* ---------- 分类 ---------- */
.cats{
  position:sticky;top:72px;z-index:15;
  display:flex;gap:8px;overflow-x:auto;padding:12px 12px 10px;
  background:linear-gradient(180deg,var(--bg) 92%,rgba(251,243,230,0));
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.cats::-webkit-scrollbar{display:none}
.cat-pill{
  flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:999px;padding:11px 16px;min-height:44px;display:inline-flex;align-items:center;
  font-size:14px;font-weight:600;
}
.cat-pill.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 10px rgba(154,74,31,.25)}

/* ---------- 菜品列表 ---------- */
.menu{padding:2px 12px 24px;display:flex;flex-direction:column;gap:10px}
.dish{
  display:flex;gap:12px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;
}
.dish-icon{
  width:60px;height:60px;border-radius:13px;flex:none;
  background:var(--bg);display:flex;align-items:center;justify-content:center;
  font-size:30px;overflow:hidden;border:1px solid var(--line);
}
.dish-icon img{width:100%;height:100%;object-fit:cover}
.dish-info{flex:1;min-width:0}
.dish-name{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
.tag{
  flex:none;font-size:12px;font-weight:700;color:#8A5A12;background:var(--amber-l);
  border-radius:6px;padding:1px 6px;letter-spacing:.5px;
}
.dish-desc{font-size:14px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.dish-row{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.price{color:var(--brand);font-weight:800;font-size:18px}
.price .yen{font-size:12px;font-weight:700;margin-right:1px}
.add-btn{
  width:44px;height:44px;border-radius:50%;border:none;flex:none;
  background:var(--brand);color:#fff;font-size:20px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0;line-height:1;
  box-shadow:0 4px 10px rgba(154,74,31,.3);
}
.qty-pill{
  display:flex;align-items:center;gap:10px;background:var(--brand-l);
  border-radius:999px;padding:3px 6px;
}
.qty-pill button{
  width:28px;height:28px;border-radius:50%;border:none;background:#fff;
  color:var(--brand-d);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;
}
.qty-pill .qty{min-width:20px;text-align:center;font-weight:800;font-size:15px}

/* ---------- 购物车底栏 ---------- */
.cart-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  max-width:480px;margin:0 auto;
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 24px rgba(58,42,26,.08);
}
.cart-ico{
  position:relative;width:46px;height:46px;border-radius:14px;flex:none;
  background:var(--brand-l);display:flex;align-items:center;justify-content:center;
}
.cart-ico svg{width:24px;height:24px;color:var(--brand-d)}
.cart-count{
  position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:999px;
  background:var(--danger);color:#fff;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}
.cart-info{flex:1;min-width:0}
.cart-total{font-weight:800;font-size:16px}
.cart-total .yen{font-size:12px;margin-right:1px}
.cart-tip{font-size:14px;color:var(--ink-3);margin-top:-2px}
.go-btn{
  border:none;border-radius:14px;padding:13px 22px;font-size:16px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--amber),var(--brand));box-shadow:0 6px 16px rgba(154,74,31,.3);
}
.go-btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 底部弹层 / 购物车 ---------- */
.overlay{position:fixed;inset:0;background:rgba(58,42,26,.45);z-index:40;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  max-width:480px;margin:0 auto;
  background:var(--surface);border-radius:22px 22px 0 0;
  max-height:86vh;display:flex;flex-direction:column;
  animation:rise .22s cubic-bezier(.2,.8,.3,1);
  box-shadow:var(--shadow);
}
@keyframes rise{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:44px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0;flex:none}
.sheet-head{padding:10px 18px 8px;display:flex;align-items:center;justify-content:space-between;flex:none}
.sheet-title{font-size:17px;font-weight:800}
.sheet-body{overflow-y:auto;padding:4px 18px 18px;-webkit-overflow-scrolling:touch}
.sheet-foot{flex:none;padding:10px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}

/* 购物车条目 */
.cart-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.cart-item:last-child{border-bottom:none}
.ci-name{flex:1;min-width:0;font-weight:600;font-size:15px}
.ci-name .ci-sub{display:block;font-size:12px;color:var(--ink-3);font-weight:400}
.ci-price{color:var(--brand);font-weight:800;font-size:15px;margin-right:6px}
.step{display:flex;align-items:center;gap:9px;background:var(--brand-l);border-radius:999px;padding:3px 5px}
.step button{width:28px;height:28px;border-radius:50%;border:none;background:#fff;color:var(--brand-d);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0}
.step .qty{min-width:20px;text-align:center;font-weight:800}

/* 表单 */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%;border:1px solid var(--line);border-radius:12px;
  padding:12px 13px;background:var(--surface);outline:none;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(154,74,31,.12)}
.field textarea{resize:vertical;min-height:64px}
.field .hint{font-size:11px;color:var(--ink-3);margin-top:4px}

.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{
  flex:1;border:none;background:transparent;border-radius:9px;padding:9px 6px;font-size:14px;font-weight:700;color:var(--ink-2);
}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 2px 6px rgba(58,42,26,.08)}

.summary{border-radius:14px;background:var(--bg);padding:12px 14px;font-size:13px;color:var(--ink-2)}
.summary .row{display:flex;justify-content:space-between;padding:2px 0}
.summary .row.total{color:var(--ink);font-weight:800;font-size:15px;border-top:1px dashed var(--line);margin-top:4px;padding-top:6px}

/* ---------- 成功弹窗 ---------- */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{
  width:100%;max-width:440px;max-height:88vh;overflow-y:auto;
  background:var(--surface);border-radius:22px;padding:22px;
  animation:rise .25s cubic-bezier(.2,.8,.3,1);box-shadow:var(--shadow);
}
.big-ok{
  width:64px;height:64px;border-radius:50%;background:var(--ok-l);color:var(--ok);
  display:flex;align-items:center;justify-content:center;margin:0 auto 10px;
}
.big-ok svg{width:34px;height:34px}
.modal h2{margin:0 0 4px;text-align:center;font-size:20px}
.modal .sub{text-align:center;color:var(--ink-3);font-size:14px;margin-bottom:14px}
.order-text{
  background:var(--bg);border:1px dashed var(--line);border-radius:14px;
  padding:14px;font-size:14px;white-space:pre-wrap;word-break:break-all;
  max-height:260px;overflow-y:auto;line-height:1.7;
}
.pay-qr-wrap{text-align:center;margin-top:14px}
.pay-qr-wrap img{width:150px;height:150px;border-radius:14px;border:1px solid var(--line);margin:8px auto 0}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}

/* ---------- 后台 ---------- */
.admin{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
.admin-top{
  display:flex;align-items:center;gap:12px;padding:12px 14px calc(12px + env(safe-area-inset-top));
  background:var(--surface);border-bottom:1px solid var(--line);flex:none;
}
.admin-top .back-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}
.admin-top .back-btn svg{width:20px;height:20px}
.admin-title{font-size:17px;font-weight:800;flex:1}
.admin-tabs{
  display:flex;gap:6px;overflow-x:auto;padding:10px 14px;flex:none;background:var(--surface);
  border-bottom:1px solid var(--line);scrollbar-width:none;
}
.admin-tabs::-webkit-scrollbar{display:none}
.atab{
  flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);
  border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;
}
.atab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.admin-body{flex:1;overflow-y:auto;padding:16px 14px 40px;-webkit-overflow-scrolling:touch}

.admin-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.admin-card h3{margin:0 0 10px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.admin-card h3 .cnt{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:600}
.ac-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.ac-row:last-child{border-bottom:none}
.ac-main{flex:1;min-width:0}
.ac-name{font-weight:700;font-size:14px}
.ac-price{font-size:13px;color:var(--ink-3)}
.ac-ops{display:flex;gap:6px;flex:none}
.mini-btn{
  border:1px solid var(--line);background:#fff;border-radius:9px;
  padding:6px 10px;font-size:12px;font-weight:600;color:var(--ink-2);
}
.mini-btn.danger{color:var(--danger);border-color:#F2CFC4}
.mini-btn.primary{color:var(--brand-d);border-color:#E4C7AD;background:var(--brand-l)}

.dish-edit-row{border-bottom:1px dashed var(--line);padding:10px 0}
.dish-edit-row:last-child{border-bottom:none}
.de-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.de-grid .full{grid-column:1/-1}
.de-label{font-size:12px;color:var(--ink-3);margin-bottom:3px}
.de-grid input,.de-grid select,.de-grid textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;outline:none;font-size:15px;
}
.de-grid input:focus,.de-grid select:focus,.de-grid textarea:focus{border-color:var(--brand)}
.de-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.de-head .de-name{font-weight:700}
.de-head .ops{margin-left:auto;display:flex;gap:6px}

.img-pick{display:flex;align-items:center;gap:10px}
.img-pick .ph{
  width:64px;height:64px;border-radius:12px;border:1px dashed var(--line);background:var(--bg);
  display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:26px;
}
.img-pick .ph img{width:100%;height:100%;object-fit:cover}
.img-pick .meta{flex:1;font-size:13px;color:var(--ink-3);line-height:1.6}

/* 二维码卡片 */
.qr-box{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;text-align:center;margin-bottom:12px;
}
.qr-box img{width:230px;height:230px;margin:4px auto 10px;border-radius:10px;border:1px solid var(--line)}
.qr-url{font-size:12px;color:var(--ink-3);word-break:break-all;margin-top:4px}

/* 订单记录 */
.order-rec{border-bottom:1px dashed var(--line);padding:10px 0}
.order-rec:last-child{border-bottom:none}
.or-head{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.or-head b{color:var(--ink);font-size:14px}
.or-body{font-size:13px;color:var(--ink-2);margin-top:6px;white-space:pre-wrap;word-break:break-all;line-height:1.7;max-height:220px;overflow-y:auto}
.or-foot{display:flex;gap:8px;margin-top:8px}

/* 提示条 */
.tip{
  background:var(--brand-l);border:1px solid #E8CBB0;color:#7C3A16;
  border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.7;margin-bottom:12px;
}
.tip.ok{background:var(--ok-l);border-color:#C4DFCC;color:#25603B}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:130px;transform:translateX(-50%);
  background:rgba(45,32,20,.92);color:#fff;border-radius:999px;
  padding:10px 18px;font-size:14px;z-index:100;max-width:80%;text-align:center;
  animation:rise .2s ease;
}

/* PIN 弹窗 */
.pin-dots{display:flex;gap:14px;justify-content:center;margin:18px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:#fff}
.pin-dot.fill{background:var(--brand);border-color:var(--brand)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pin-key{
  height:56px;border:1px solid var(--line);border-radius:14px;background:var(--surface);
  font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.pin-key:active{background:var(--brand-l)}

/* 空态 */
.empty{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:14px}

@media (min-width:600px){
  .app{border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
  .sheet,.cart-bar{border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

<div class="app" id="app">
  <!-- 顶部 -->
  <header class="header">
    <div class="header-row">
      <div class="logo-mark"><svg><use href="#i-bowl" xlink:href="#i-bowl"/></svg></div>
      <div>
        <div class="shop-name" id="shopName">甜品糖水铺</div>
        <div class="shop-slogan" id="shopSlogan">现熬现煮 · 真材实料 · 街坊味道</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnAdmin" title="商家后台"><svg><use href="#i-gear" xlink:href="#i-gear"/></svg></button>
      </div>
    </div>
  </header>

  <!-- 公告 -->
  <div class="notice-bar hidden" id="noticeBar"><svg><use href="#i-bell" xlink:href="#i-bell"/></svg><div id="noticeText"></div></div>

  <!-- 分类 -->
  <nav class="cats" id="cats"></nav>

  <!-- 菜单 -->
  <main class="menu" id="menu"></main>

  <!-- 页脚 -->
  <div style="text-align:center;padding:18px 16px 8px;color:var(--ink-3);font-size:14px;line-height:1.8">
    <div>在线点餐 · 线下转账付款 · 无平台抽成</div>
    <button class="mini-btn" style="margin-top:10px;padding:11px 18px;min-height:44px" id="btnAdmin2">商家后台入口</button>
  </div>
</div>

<!-- 购物车底栏 -->
<div class="cart-bar" id="cartBar">
  <div class="cart-ico">
    <svg><use href="#i-cart" xlink:href="#i-cart"/></svg>
    <span class="cart-count hidden" id="cartCount">0</span>
  </div>
  <div class="cart-info">
    <div class="cart-total"><span class="yen">¥</span><span id="cartTotal">0</span></div>
    <div class="cart-tip" id="cartTip">购物车是空的</div>
  </div>
  <button class="go-btn" id="btnGoCart" disabled>去结算</button>
</div>

<!-- 购物车弹层 -->
<div class="overlay hidden" id="cartOverlay"></div>
<div class="sheet hidden" id="cartSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div class="sheet-title">购物车</div>
    <button class="icon-btn" style="background:var(--bg);color:var(--ink-2)" id="btnCloseCart"><svg style="width:20px;height:20px"><use href="#i-x" xlink:href="#i-x"/></svg></button>
  </div>
  <div class="sheet-body">
    <div id="cartItems"></div>
    <div class="field" style="margin-top:12px">
      <label>订单备注（口味 / 少糖 / 少冰等）</label>
      <textarea id="orderNote" placeholder="选填，例如：绿豆沙去冰、双皮奶少糖"></textarea>
    </div>
    <div class="field">
      <label>取餐方式</label>
      <div class="seg" id="segMode">
        <button type="button" data-mode="takeout" class="on">外卖配送</button>
        <button type="button" data-mode="pickup">到店自取</button>
      </div>
    </div>
    <div id="addrFields">
      <div class="field"><label>姓名</label><input id="custName" placeholder="怎么称呼你" autocomplete="name"></div>
      <div class="field"><label>手机号</label><input id="custPhone" type="tel" placeholder="配送联系用" autocomplete="tel"></div>
      <div class="field"><label>外卖地址</label><textarea id="custAddr" placeholder="小区 / 街道 / 门牌号等"></textarea></div>
    </div>
    <div class="summary" id="cartSummary"></div>
  </div>
  <div class="sheet-foot">
    <button class="btn btn-primary" id="btnSubmit">提交订单</button>
  </div>
</div>

<!-- 下单成功弹窗 -->
<div class="overlay hidden" id="okOverlay"></div>
<div class="modal hidden" id="okModal" style="z-index:61">
  <div class="modal-card">
    <div class="big-ok"><svg><use href="#i-check" xlink:href="#i-check"/></svg></div>
    <h2>下单成功</h2>
    <div class="sub" id="okSub">请把订单发给商家，付款后等待出餐</div>
    <div class="order-text" id="orderText"></div>
    <div class="pay-qr-wrap hidden" id="payQrWrap">
      <div style="font-size:14px;color:var(--ink-2);font-weight:700">扫一扫，线下转账付款（无手续费）</div>
      <img id="payQrImg" alt="商家收款码">
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="btnSendWechat"><svg style="width:20px;height:20px"><use href="#i-wechat" xlink:href="#i-wechat"/></svg>复制订单并发微信</button>
      <button class="btn btn-ghost" id="btnCopyOrder"><svg style="width:18px;height:18px"><use href="#i-copy" xlink:href="#i-copy"/></svg>仅复制订单文字</button>
      <button class="btn btn-line" id="btnDone">完成，再点一单</button>
    </div>
  </div>
</div>

<!-- PIN 锁 -->
<div class="overlay hidden" id="pinOverlay"></div>
<div class="modal hidden" id="pinModal" style="z-index:71">
  <div class="modal-card" style="max-width:320px">
    <h2 style="font-size:18px">商家后台</h2>
    <div class="sub">请输入管理密码（默认 8888）</div>
    <div class="pin-dots" id="pinDots"></div>
    <div class="pin-pad" id="pinPad"></div>
    <div style="text-align:center;margin-top:12px">
      <button class="btn btn-line btn-sm" id="btnPinClose">取消</button>
    </div>
  </div>
</div>

<!-- 后台 -->
<div class="admin hidden" id="adminView">
  <div class="admin-top">
    <button class="back-btn" id="btnAdminBack"><svg><use href="#i-back" xlink:href="#i-back"/></svg></button>
    <div class="admin-title">商家后台</div>
    <button class="mini-btn" id="btnAdminView">预览顾客端</button>
  </div>
  <div class="admin-tabs" id="adminTabs">
    <button class="atab on" data-tab="dishes">菜品管理</button>
    <button class="atab" data-tab="shop">门店设置</button>
    <button class="atab" data-tab="qr">点餐二维码</button>
    <button class="atab" data-tab="orders">订单记录</button>
    <button class="atab" data-tab="data">数据备份</button>
  </div>
  <div class="admin-body" id="adminBody"></div>
</div>

<div class="toast hidden" id="toast"></div>

function copyText(text,tip){
  function done(){toast(tip||'已复制')}
  function fb(){
    var ta=document.createElement('textarea');
    ta.value=text;ta.setAttribute('readonly','');
    ta.style.position='fixed';ta.style.left='-9999px';ta.style.top='0';
    document.body.appendChild(ta);ta.focus();ta.select();

    navigator.clipboard.writeText(text).then(done)['catch'](fb);
  }else{fb()}
}

/* ---------- 订单 ---------- */
function newOrderId(){
  var d=new Date();
  var s=pad2(d.getFullYear()%100)+pad2(d.getMonth()+1)+pad2(d.getDate());
  var r='',chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',i;
  for(i=0;i<4;i++)r+=chars.charAt(Math.floor(Math.random()*chars.length));
  return 'DS'+s+r;
}
function fmtTime(d){
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
}
function buildOrderText(o){
  var s=state.settings,L=[];
  L.push('【新订单】'+s.shopName);
  L.push('单号：'+o.id+'　'+o.time);
  L.push('————————————');
  each(o.items,function(it){L.push('· '+it.name+' ×'+it.qty+'　¥'+fmt(it.price*it.qty))});
  L.push('————————————');
  L.push('小计：¥'+fmt(o.subtotal));
  if(o.mode==='takeout')L.push('配送费：¥'+fmt(o.fee));
  L.push('合计：¥'+fmt(o.total)+'（线下转账付款）');
  L.push('————————————');
  L.push('取餐方式：'+(o.mode==='takeout'?'外卖配送':'到店自取'));
  L.push('姓名：'+(o.name||'-'));
  if(o.phone)L.push('电话：'+o.phone);
  if(o.addr)L.push('地址：'+o.addr);
  if(o.note)L.push('备注：'+o.note);
  L.push('————————————');
  L.push('时间：'+o.time);
  if(s.wechatNick)L.push('商家微信：'+s.wechatNick+(s.wechatId?'（'+s.wechatId+'）':''));
  return L.join('\n');
}
function submitOrder(){
  var items=cartItems();
  if(!items.length){toast('购物车是空的');return}
  var sub=cartSubtotal(),fee=cartFee(),total=sub+fee;
  if(Number(state.settings.minOrder)>0&&total<Number(state.settings.minOrder)){toast('未达起送价 ¥'+fmt(state.settings.minOrder));return}
  var mode=state.mode;
  var name=$('custName').value.trim(),phone=$('custPhone').value.trim(),addr=$('custAddr').value.trim(),note=$('orderNote').value.trim();
  if(mode==='takeout'){
    if(!name){toast('请填写姓名');return}
    if(!phone){toast('请填写手机号');return}
    if(!addr){toast('请填写外卖地址');return}
  }
  if(!name)name='到店自取';
  var o={
    id:newOrderId(),time:fmtTime(new Date()),mode:mode,
    items:items.map(function(d){return{id:d.id,name:d.name,price:d.price,qty:state.cart[d.id]}}),
    subtotal:sub,fee:fee,total:total,
    name:name,phone:phone,addr:addr,note:note
  };
  state.orders.unshift(o);
  if(state.orders.length>200)state.orders.length=200;
  saveOrders();
  state.cart={};saveCart();
  closeCart();showSuccess(o);
}
function showSuccess(o){
  window._lastOrder=o;
  $('orderText').textContent=buildOrderText(o);
  $('okSub').textContent=(o.mode==='takeout')?'把订单发给商家并转账，坐等出餐':'把订单发给商家，到店报姓名取餐';
  var pw=$('payQrWrap');
  if(state.settings.payQr){pw.classList.remove('hidden');$('payQrImg').src=state.settings.payQr}
  else{pw.classList.add('hidden')}
  var row=$('okWechatRow');
  if(!row){
    row=document.createElement('div');row.id='okWechatRow';
    row.style.cssText='text-align:center;font-size:13px;margin-top:12px;color:var(--ink-2);line-height:2';
    $('okModal').querySelector('.modal-card').insertBefore(row,$('payQrWrap'));
  }
  if(state.settings.wechatId){
    row.innerHTML='商家微信：<b>'+esc(state.settings.wechatId)+'</b> <button class="mini-btn" id="btnCopyWx">复制微信号</button>';
    $('btnCopyWx').onclick=function(){copyText(state.settings.wechatId,'微信号已复制，去微信添加后发送')};
  }else{row.innerHTML=''}
  var card=$('okModal').querySelector('.modal-card');card.scrollTop=0;
  $('okOverlay').classList.remove('hidden');$('okModal').classList.remove('hidden');
}

function sendOrderToWechat(){
  if(!window._lastOrder)return;
  var text=buildOrderText(window._lastOrder);
  copyText(text,'订单文字已复制');
  setTimeout(function(){
    try{location.href='weixin://'}

}

function pickImage(cb,label){
  var inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];
    if(!f)return;
    if(f.size>5*1024*1024){toast('图片太大，请选 5MB 以内的');return}
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var MAX=900,w=img.width,h=img.height;
        if(w>MAX||h>MAX){
          if(w>h){h=Math.round(h*MAX/w);w=MAX}
          else{w=Math.round(w*MAX/h);h=MAX}
        }
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;
        var ctx=cv.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        cb(cv.toDataURL('image/jpeg',0.85));
      };
      img.onerror=function(){toast('图片读取失败，请换一张')};
      img.src=fr.result;
    };
    fr.readAsDataURL(f);
  };
  inp.click();
}

  h+='<div class="field"><label>微信号</label><input id="stWx" value="'+esc(s.wechatId||'')+'" placeholder="例如 wxid_xxx 或手机号"></div>';
  h+='<div class="field"><label>微信昵称（选填，方便顾客认出你）</label><input id="stWxNick" value="'+esc(s.wechatNick||'')+'" placeholder="例如：阿婆糖水"></div>';

  h+='<div class="img-pick"><div class="ph" id="wxPh">'+(s.wechatQr?'<img src="'+esc(s.wechatQr)+'">':'<svg style="width:26px;height:26px;color:var(--ink-3)"><use href="#i-qr" xlink:href="#i-qr"/></svg>')+'</div>'+
    '<div class="meta">截图上传即可<br>建议 500KB 以内</div></div>';
  h+='<div style="display:flex;gap:8px;margin-top:8px"><button class="mini-btn" id="stWxUp">上传</button><button class="mini-btn danger" id="stWxClr">清除</button></div></div>';
  h+='</div>';
  h+='<div class="admin-card"><h3>收款码（线下转账，零手续费）</h3>';
  h+='<div class="field"><label>微信 / 支付宝收款码图片</label>';
  h+='<div class="img-pick"><div class="ph" id="payPh">'+(s.payQr?'<img src="'+esc(s.payQr)+'">':'<svg style="width:26px;height:26px;color:var(--ink-3)"><use href="#i-qr" xlink:href="#i-qr"/></svg>')+'</div>'+
    '<div class="meta">顾客下单后直接扫码转账<br>不经过任何平台</div></div>';
  h+='<div style="display:flex;gap:8px;margin-top:8px"><button class="mini-btn" id="payUp">上传</button><button class="mini-btn danger" id="payClr">清除</button></div></div>';
  h+='</div>';
  h+='<div class="admin-card"><h3>配送与密码</h3><div class="de-grid">';
  h+='<div><div class="de-label">配送费（元，0 表示免费）</div><input id="stFee" type="number" min="0" step="0.5" value="'+esc(s.deliveryFee||0)+'"></div>';
  h+='<div><div class="de-label">起送价（元，0 表示不限）</div><input id="stMin" type="number" min="0" step="1" value="'+esc(s.minOrder||0)+'"></div>';
  h+='<div class="full"><div class="de-label">后台密码（4-6 位数字，默认 8888）</div><input id="stPin" type="password" inputmode="numeric" maxlength="6" value="'+esc(s.pin)+'"></div>';
  h+='</div></div>';
  h+='<button class="btn btn-primary" id="stSave">保存设置</button>';

  $('stWxUp').onclick=function(){pickImage(function(data){s.wechatQr=data;renderAdminShop(box)},'微信二维码')};
  $('stWxClr').onclick=function(){s.wechatQr='';renderAdminShop(box)};
  $('payUp').onclick=function(){pickImage(function(data){s.payQr=data;renderAdminShop(box)},'收款码')};
  $('payClr').onclick=function(){s.payQr='';renderAdminShop(box)};
  $('stSave').onclick=function(){
    s.shopName=$('stName').value.trim()||'甜品糖水铺';
    s.slogan=$('stSlogan').value.trim();
    s.notice=$('stNotice').value.trim();
    s.wechatId=$('stWx').value.trim();
    s.wechatNick=$('stWxNick').value.trim();
    var fee=parseFloat($('stFee').value);
    var min=parseFloat($('stMin').value);
    s.deliveryFee=(isNaN(fee)||fee<0)?0:Math.round(fee*100)/100;
    s.minOrder=(isNaN(min)||min<0)?0:Math.round(min*100)/100;
    var pin=$('stPin').value.trim();
    if(!/^\d{4,6}$/.test(pin)){toast('密码需为 4-6 位数字');return}

    renderHeader();
    toast('设置已保存');

/* ---------- 点餐二维码 ---------- */
function renderAdminQR(box){
  var h='<div class="tip">把点餐页放到免费静态托管（GitHub Pages / Cloudflare Pages / Netlify / Gitee Pages 等，详见使用说明）后，把网址填到下面，生成二维码打印出来贴在摊位或餐车上，顾客扫码即点餐，无需下载 App。</div>';
  h+='<div class="field"><label>点餐页网址</label><input id="qrUrl" value="'+esc(state.qrUrl)+'" placeholder="https://你的网址/点餐页.html"></div>';
  h+='<div class="qr-box"><img id="qrImg" alt="点餐二维码"><div class="qr-url" id="qrUrlTip">填入网址后点「生成二维码」</div></div>';
  h+='<div style="display:flex;gap:10px">';
  h+='<button class="btn btn-primary" style="flex:1" id="qrGen">生成二维码</button>';
  h+='<button class="btn btn-ghost" style="flex:1" id="qrDl" disabled>下载图片</button>';
  h+='<button class="btn btn-line" style="flex:1" id="qrPrint" disabled>打印</button>';
  h+='</div>';
  box.innerHTML=h;
  if(state.qrUrl)$('qrUrl').value=state.qrUrl;
  $('qrGen').onclick=function(){
    var url=$('qrUrl').value.trim();
    if(!url){toast('请先填写点餐页网址');return}
    if(!/^https?:\/\//i.test(url)){toast('网址要以 http(s):// 开头');return}
    try{
      if(qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs['UTF-8']){qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8']}
      var qr=qrcode(0,'M');
      qr.addData(url);
      qr.make();
      state.qrImg=qr.createDataURL(8,24);
      state.qrUrl=url;
      try{localStorage.setItem(LS_QRURL,url)}catch(e){}
      $('qrImg').src=state.qrImg;
      $('qrUrlTip').textContent=url;
      $('qrDl').disabled=false;$('qrPrint').disabled=false;
      toast('二维码已生成');
    }catch(e){
      toast('生成失败：'+(e&&e.message?e.message:e));
    }
  };
  $('qrDl').onclick=function(){
    if(!state.qrImg)return;
    var a=document.createElement('a');
    a.href=state.qrImg;
    a.download=(state.settings.shopName||'点餐')+'点餐二维码.png';
    a.click();
    toast('已开始下载');
  };
  $('qrPrint').onclick=function(){printQR()};
}
function printQR(){
  if(!state.qrImg){toast('请先生成二维码');return}
  var w=window.open('','_blank');
  if(!w){toast('浏览器拦截了弹窗，请允许后重试');return}
  w.document.write('<html><head><meta charset="utf-8"><title>打印点餐二维码</title>'+
    '<style>body{font-family:sans-serif;text-align:center;padding:30px}h1{font-size:28px;margin:0 0 4px}p{color:#666;margin:3px 0;word-break:break-all}img{width:300px;height:300px;margin:14px auto;display:block}.tagline{font-size:14px}</style></head><body>');
  w.document.write('<h1>'+esc(state.settings.shopName)+'</h1>');
  w.document.write('<p class="tagline">扫码点餐 · 免下载 · 免登录 · 线下付款</p>');
  w.document.write('<img src="'+state.qrImg+'">');
  w.document.write('<p>'+esc(state.qrUrl)+'</p>');
  w.document.write('<script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script></body></html>');
  w.document.close();
}

/* ---------- 订单记录 ---------- */
function renderAdminOrders(box){
  if(!state.orders.length){
    box.innerHTML='<div class="empty">还没有本地订单记录。<br><br>说明：纯前端网页无法直接收单，顾客提交后订单会以文字发到你的微信，接单以微信收到的为准。这里的记录保存在本机浏览器，方便你核对。</div>';
    return;
  }
  var h='<div class="tip ok">本机浏览器保存的订单记录（最近 200 条，随顾客端提交同步记录）。真正接单以微信收到的订单文字为准。</div>';
  h+='<button class="btn btn-danger btn-sm" id="ordClear" style="margin-bottom:12px">清空本地订单记录</button>';
  each(state.orders,function(o){
    h+='<div class="admin-card" style="padding:12px">'+
      '<div class="or-head"><b>'+esc(o.id)+'</b><span>'+esc(o.time)+'</span>'+
      '<span style="margin-left:auto;color:var(--brand);font-weight:800">¥'+fmt(o.total)+'</span></div>'+
      '<div class="or-body">'+esc(buildOrderText(o))+'</div>'+
      '<div class="or-foot"><button class="mini-btn" data-ocopy="'+esc(o.id)+'">复制</button>'+
      '<button class="mini-btn danger" data-odel="'+esc(o.id)+'">删除</button></div></div>';
  });
  box.innerHTML=h;
  each(box.querySelectorAll('[data-ocopy]'),function(b){
    b.onclick=function(){
      var id=this.getAttribute('data-ocopy');
      var o=state.orders.filter(function(x){return x.id===id})[0];
      if(o)copyText(buildOrderText(o),'订单文字已复制');
    };
  });
  each(box.querySelectorAll('[data-odel]'),function(b){
    b.onclick=function(){
      var id=this.getAttribute('data-odel');
      state.orders=state.orders.filter(function(x){return x.id!==id});
      saveOrders();renderAdminTab();toast('已删除');
    };
  });
  $('ordClear').onclick=function(){
    if(confirm('确定清空全部本地订单记录？')){
      state.orders=[];saveOrders();renderAdminTab();toast('已清空');
    }
  };
}

/* ---------- 数据备份 ---------- */
function renderAdminData(box){
  var h='<div class="tip">重要：后台改的菜价、设置只保存在这台设备的浏览器里，顾客看不到。要让顾客看到新菜单，必须点下面的「一键发布」，把生成的新文件上传到托管平台覆盖旧文件。</div>';
  h+='<div class="admin-card"><h3>一键发布最新菜单（改价 / 改菜后必做）</h3>';
  h+='<p style="font-size:13px;color:var(--ink-2);margin:0 0 10px;line-height:1.8">生成一个包含当前全部菜品和设置的新 HTML 文件（自动升级版本号，老顾客下次打开自动更新）。下载后改名为 index.html，上传到 GitHub 等托管平台覆盖旧文件即可，二维码不用重做。</p>';
  h+='<button class="btn btn-primary" id="dataPub"><svg style="width:18px;height:18px"><use href="#i-download" xlink:href="#i-download"/></svg>生成发布版 HTML（下载）</button>';
  h+='</div>';
  h+='<div class="admin-card"><h3>备份与恢复</h3>';
  h+='<div style="display:flex;gap:10px">';
  h+='<button class="btn btn-ghost" style="flex:1" id="dataExp"><svg style="width:18px;height:18px"><use href="#i-export" xlink:href="#i-export"/></svg>导出全部数据</button>';
  h+='<button class="btn btn-line" style="flex:1" id="dataImp"><svg style="width:18px;height:18px"><use href="#i-import" xlink:href="#i-import"/></svg>导入备份</button>';
  h+='</div></div>';
  h+='<div class="admin-card"><h3>恢复默认</h3>';
  h+='<p style="font-size:13px;color:var(--ink-2);margin:0 0 10px">把菜品、分类、设置恢复成初始示例（不影响订单记录）。</p>';
  h+='<button class="btn btn-danger btn-sm" id="dataRst">恢复默认菜单与设置</button></div>';
  h+='<div class="admin-card"><h3>关于</h3>';
  h+='<p style="font-size:12.5px;color:var(--ink-2);margin:0;line-height:1.9">纯前端网页 · 无需服务器 · 无广告 · 无平台抽成 · 永久免费<br>数据只存在本机浏览器，请定期导出备份。</p></div>';
  box.innerHTML=h;
  $('dataPub').onclick=exportPublish;
  $('dataExp').onclick=function(){
    var payload={app:'甜品糖水点餐系统',version:1,exported:fmtTime(new Date()),settings:state.settings,cats:state.cats,menu:state.menu,orders:state.orders};
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=(state.settings.shopName||'点餐系统')+'备份-'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
    toast('已导出备份文件');
  };
  $('dataImp').onclick=function(){
    var inp=document.createElement('input');
    inp.type='file';inp.accept='.json,application/json';
    inp.onchange=function(){
      var f=inp.files&&inp.files[0];
      if(!f)return;
      var fr=new FileReader();
      fr.onload=function(){
        try{
          var data=JSON.parse(fr.result);
          if(!data||!data.menu||!data.cats)throw new Error('bad');
          state.menu=data.menu;
          state.cats=data.cats;
          if(data.settings)state.settings=extend(clone(DEFAULT_SETTINGS),data.settings);
          if(data.orders)state.orders=data.orders;
          persistAll();
          renderHeader();renderAdminTab();renderCats();renderMenu();
          toast('导入成功');
        }catch(e){
          toast('导入失败：文件格式不对');
        }
      };
      fr.readAsText(f);
    };
    inp.click();
  };
  $('dataRst').onclick=function(){
    if(!confirm('确定恢复默认菜单与设置？当前自定义内容会被覆盖。')){
      return;
    }
    state.menu=clone(DEFAULT_MENU);
    state.cats=clone(DEFAULT_CATS);
    state.settings=clone(DEFAULT_SETTINGS);
    persistAll();
    renderHeader();renderAdminTab();renderCats();renderMenu();
    toast('已恢复默认');
  };
}

/* ---------- 一键发布：生成包含当前数据的最新版 HTML ---------- */
function closeAllOverlays(){
  try{closeCart()}catch(e){}
  try{closeSuccess()}catch(e){}
  try{closePin()}catch(e){}
  if(!$('adminView').classList.contains('hidden'))closeAdmin();
}
function exportPublish(){
  closeAllOverlays();
  try{
    var src='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    var escJson=function(o){return JSON.stringify(o).replace(/<\//g,'<\\/')};
    src=src.replace(/\/\*__MENU__\*\/[\s\S]*?\/\*__MENU_END__\*\//,'/*__MENU__*/'+escJson(state.menu)+'/*__MENU_END__*/');
    src=src.replace(/\/\*__CATS__\*\/[\s\S]*?\/\*__CATS_END__\*\//,'/*__CATS__*/'+escJson(state.cats)+'/*__CATS_END__*/');
    src=src.replace(/\/\*__SETTINGS__\*\/[\s\S]*?\/\*__SETTINGS_END__\*\//,'/*__SETTINGS__*/'+escJson(state.settings)+'/*__SETTINGS_END__*/');
    src=src.replace(/(var DATA_VERSION=)\d+/,'$1'+(DATA_VERSION+1));
    var blob=new Blob([src],{type:'text/html;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='index.html';
    a.click();
    toast('发布版已生成（index.html）→ 上传托管平台覆盖旧文件');
  }catch(e){
    toast('生成失败：'+(e&&e.message?e.message:e));
  }
}

/* ============================================================
   初始化与事件
   ============================================================ */
function init(){
  load();
  buildPinPad();
  renderHeader();renderCats();renderMenu();renderCartBar();
  if(window._verRefreshed)toast('菜单已更新到最新版');

  $('btnAdmin').onclick=tryOpenAdmin;
  $('btnAdmin2').onclick=tryOpenAdmin;

  $('btnGoCart').onclick=function(){if(cartCount()>0)openCart()};
  $('btnCloseCart').onclick=closeCart;
  $('cartOverlay').onclick=closeCart;

  $('okOverlay').onclick=closeSuccess;
  $('btnDone').onclick=closeSuccess;
  $('btnCopyOrder').onclick=function(){
    if(window._lastOrder)copyText(buildOrderText(window._lastOrder),'订单文字已复制');
  };
  $('btnSendWechat').onclick=sendOrderToWechat;

  $('segMode').onclick=function(e){
    var b=closestEl(e.target,'[data-mode]');
    if(!b)return;
    state.mode=b.getAttribute('data-mode');
    renderCartSheet();
  };
  $('btnSubmit').onclick=submitOrder;

  $('btnAdminBack').onclick=closeAdmin;
  $('btnAdminView').onclick=closeAdmin;
  $('adminTabs').onclick=function(e){
    var b=closestEl(e.target,'[data-tab]');
    if(!b)return;
    state.adminTab=b.getAttribute('data-tab');
    renderAdmin();
  };
  $('btnPinClose').onclick=closePin;
  $('pinOverlay').onclick=closePin;
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}
</script>
